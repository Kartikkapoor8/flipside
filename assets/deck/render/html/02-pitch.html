  --font-text: -apple-system, "SF Pro Text", "SF Pro Display", "SF Pro", Inter, system-ui, sans-serif;
  --fs-title: 84px; --fs-statement: 60px; --fs-heading: 44px;
  --fs-body: 26px; --fs-label: 17px; --fs-caption: 15px;
  /* space and radius */
  --margin: 64px; --gutter: 64px;
  --r-control: 8px; --r-card: 14px;
}

html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--a-bg);color:var(--a-text);font-family:var(--font-text);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1200px;height:630px}
.face{position:absolute;top:0;width:600px;height:630px;box-sizing:border-box;padding:var(--margin);background:var(--a-bg);display:flex;flex-direction:column}
.face.l{left:0}.face.r{left:600px}.face.lit{background:var(--a-surface)}.face.mid{justify-content:center}
.crease{position:absolute;left:599.5px;top:0;width:1px;height:630px;background:var(--crease-light)}
.crease.top{height:170px}.crease.bot{top:456px;height:174px}
.tab{position:absolute;left:598.5px;top:0;width:3px;height:28px;background:var(--a-accent)}
.label{font-size:var(--fs-label);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--a-muted)}
.spacer{flex:1}
h1.title{font-family:var(--font-display);font-weight:400;font-size:var(--fs-title);line-height:1.04;letter-spacing:-.01em;margin:0}
h1.title.long{font-size:68px}
.statement{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:var(--fs-statement);line-height:1.12;letter-spacing:-.005em;margin:0}
.statement.up{font-style:normal}
h2.heading{font-family:var(--font-display);font-weight:400;font-size:var(--fs-heading);line-height:1.15;margin:16px 0 0}
p.body{font-size:var(--fs-body);line-height:1.4;color:var(--a-text);margin:24px 0 0}
p.body.muted{color:var(--a-muted)}
.num{font-family:var(--font-display);font-size:var(--fs-heading);color:var(--a-muted);line-height:1}
.wordmark{width:430px}.wordmark svg{display:block;width:100%;height:auto}
.markbox{width:56px;height:56px;margin-bottom:20px}.markbox svg{width:100%;height:100%;display:block}
/* two-column: mini presenter card on the private face */
.mini{margin-top:20px;background:var(--p-bg);color:var(--p-text);border-radius:var(--r-card);padding:22px 24px;height:296px;box-sizing:border-box;display:flex;flex-direction:column}
.mini .h{display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--p-muted)}
.mini .h b{font-size:30px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--p-text);font-variant-numeric:tabular-nums;line-height:1}
.mini .n{flex:1;margin-top:18px}.mini .n i{display:block;height:10px;border-radius:5px;background:rgba(154,163,174,.32);margin:0 0 12px}
.mini .f{display:flex;justify-content:space-between;align-items:flex-end}
.mini .f em{font-family:var(--font-display);font-style:italic;font-size:28px;color:var(--p-accent);line-height:1}
.mini .f span{width:96px;height:50px;border-radius:6px;background:var(--a-surface);border:1px solid var(--crease-dark)}
/* live: topic field and three slots */
.field{display:flex;align-items:center;gap:14px;height:66px;border-radius:var(--r-control);background:var(--a-bg);border:1px solid rgba(17,20,24,.18);padding:0 20px;font-size:21px;color:var(--a-muted)}
.field svg{width:26px;height:26px;color:var(--a-accent)}.field i{width:2px;height:26px;background:var(--a-accent);margin-left:-6px}
.ghosts{display:flex;gap:12px;margin-top:16px}
.ghosts div{flex:1;height:82px;border-radius:var(--r-control);border:1.5px dashed rgba(17,20,24,.28);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--a-muted)}
/* listen: cue pill */
.pill{display:inline-flex;align-items:center;gap:12px;margin-top:32px;padding:12px 20px;border-radius:999px;background:var(--a-bg);border:1px solid rgba(17,20,24,.18);font-size:20px;color:var(--a-muted);align-self:flex-start}
.pill i{display:block;width:10px;height:10px;border-radius:50%;background:var(--a-accent)}.pill em{font-style:normal;color:var(--a-accent)}
/* close: both faces quiet, mark astride the crease, crease interrupted */
.centre{position:absolute;left:0;top:196px;width:1200px;text-align:center}
.centre .markbox{margin:0 auto 26px;width:88px;height:88px}
.centre h2{font-family:var(--font-display);font-weight:400;font-size:56px;line-height:1.15;margin:0}
.centre p{font-size:var(--fs-body);color:var(--a-muted);margin:12px 0 0}
</style></head><body><div class="slide"><div class="face l"><div class="num">02</div></div><div class="face r lit mid"><p class="statement">Every pitch happens on a phone now.</p><p class="body">A realtor with a listing. A founder in a hallway. Turning your phone around shows them your notes, your texts, everything.</p></div><div class="crease"></div><div class="tab"></div></div></body></html>
